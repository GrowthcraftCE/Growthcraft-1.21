# SonarCloud configuration for Growthcraft
# Provide your actual organization key and project key below.
# The SONAR_TOKEN must be configured as a GitHub repository secret named SONAR_TOKEN.

# Organization on SonarCloud
sonar.organization=growthcraftce

# Unique project key on SonarCloud
sonar.projectKey=GrowthcraftCE_Growthcraft-1.21

# SonarCloud host URL
sonar.host.url=https://sonarcloud.io

# A readable name shown in SonarCloud UI
sonar.projectName=Growthcraft-1.21 (NeoForge)

# Project version ? we reuse Gradle mod_version if needed; hardcode fallback
sonar.projectVersion=1.21.1.5

# Default source encoding
sonar.sourceEncoding=UTF-8

# Paths
sonar.sources=src/main/java
sonar.tests=src/test/java

# Java settings
sonar.java.source=21
sonar.java.target=21

# Compiled classes (required by Sonar Java analyzer)
sonar.java.binaries=build/classes/java/main
sonar.java.test.binaries=build/classes/java/test

# Exclusions (adjust as needed)
sonar.exclusions=src/generated/**,src/main/resources/**,run/**

# Test coverage (optional). If you later add Jacoco, uncomment and configure paths.
# sonar.java.coveragePlugin=jacoco
# sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml

# PR decoration is handled via the GitHub Action using GITHUB_TOKEN. Host is default (sonarcloud.io).
