tasks.register('migrationProgress') {
    group = 'verification'
    description = 'Reports current resource ID coverage against the Growthcraft 1.20 content target.'

    def targetDir = file('src/test/resources/content-target')
    inputs.dir(targetDir)
    inputs.dir(file('src/main/resources'))
    inputs.dir(file('src/generated/resources')).optional()

    def reportFile = layout.buildDirectory.file('reports/growthcraft/migration-progress.md')
    outputs.file(reportFile)

    doLast {
        def categories = ['blocks', 'items', 'recipes']
        def report = new StringBuilder()
        report.append('# Growthcraft Migration Progress\n\n')
        report.append('Compares current resources in `src/main/resources` and `src/generated/resources` against ID targets extracted from `.previous`.\n\n')
        report.append('| Category | Current | Target | Missing | Coverage |\n')
        report.append('| --- | ---: | ---: | ---: | ---: |\n')

        def missingByCategory = [:]
        categories.each { category ->
            def targetIds = readContentIds(file("${targetDir}/${category}.txt"))
            def currentIds = scanResourceIds(category)
            def missingIds = (targetIds - currentIds).toSorted()
            missingByCategory[category] = missingIds

            def coverage = targetIds.isEmpty()
                    ? '100.0%'
                    : String.format(Locale.ROOT, '%.1f%%', ((targetIds.size() - missingIds.size()) * 100.0d) / targetIds.size())
            report.append("| ${category.capitalize()} | ${currentIds.size()} | ${targetIds.size()} | ${missingIds.size()} | ${coverage} |\n")
        }

        missingByCategory.each { category, missingIds ->
            report.append("\n## Missing ${category.capitalize()}\n\n")
            if (missingIds.isEmpty()) {
                report.append('None.\n')
            } else {
                missingIds.each { report.append("- `${it}`\n") }
            }
        }

        def recipes = scanRecipesWithTypes()
        def vanillaRecipes = recipes.findAll { it.type?.startsWith('minecraft:') }
        def supportedCustomRecipes = recipes.findAll { supportedCustomRecipeTypes.containsKey(it.type) }
        def blockedCustomRecipes = recipes.findAll { blockedCustomRecipeTypes.containsKey(it.type) }
        def externalCustomRecipes = recipes.findAll {
            it.type != null
                    && !it.type.startsWith('minecraft:')
                    && !it.type.startsWith('growthcraft')
        }
        def unknownCustomRecipes = recipes.findAll {
            it.type != null
                    && !it.type.startsWith('minecraft:')
                    && it.type.startsWith('growthcraft')
                    && !supportedCustomRecipeTypes.containsKey(it.type)
                    && !blockedCustomRecipeTypes.containsKey(it.type)
        }

        report.append('\n## Recipe Runtime Status\n\n')
        report.append('This separates resource presence from whether the current 1.21 runtime can load/process the recipe type.\n\n')
        report.append('| Status | Recipes | Meaning |\n')
        report.append('| --- | ---: | --- |\n')
        report.append("| Vanilla | ${vanillaRecipes.size()} | Uses a Minecraft recipe type. |\n")
        report.append("| Supported custom | ${supportedCustomRecipes.size()} | Custom type has current registered runtime support. |\n")
        report.append("| Blocked custom | ${blockedCustomRecipes.size()} | Legacy/custom type is present but its machine/runtime is not ported yet. |\n")
        report.append("| External integration | ${externalCustomRecipes.size()} | Uses another mod's recipe type and depends on that integration. |\n")
        report.append("| Unknown Growthcraft custom | ${unknownCustomRecipes.size()} | Growthcraft custom type is not in the migration catalogue and needs triage. |\n")

        def groupedBlocked = blockedCustomRecipes.groupBy { it.type }.toSorted { a, b -> a.key <=> b.key }
        report.append('\n### Blocked Custom Recipe Types\n\n')
        if (groupedBlocked.isEmpty()) {
            report.append('None.\n')
        } else {
            groupedBlocked.each { type, entries ->
                report.append("- `${type}` (${entries.size()}): ${blockedCustomRecipeTypes[type]}\n")
            }
        }

        report.append('\n### Unknown Growthcraft Custom Recipe Types\n\n')
        if (unknownCustomRecipes.isEmpty()) {
            report.append('None.\n')
        } else {
            unknownCustomRecipes.each { recipe ->
                report.append("- `${recipe.id}` uses `${recipe.type}`\n")
            }
        }

        def output = reportFile.get().asFile
        output.parentFile.mkdirs()
        output.text = report.toString()
        logger.lifecycle("Migration progress report written to ${output}")
    }
}
