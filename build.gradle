plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.107'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    // Add here additional repositories if required by some of the dependencies below.
    mavenCentral()
    // Curse Forge
    maven {
        url "https://www.cursemaven.com"
    }
    // JEI, Tinker's Construct, Mantle, Iron Chests, Natura, etc.
    maven {
        url = "https://maven.blamejared.com/"
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            // Explicitly set correct NeoForge launch target to avoid accidental Forge target selection
            type = "neoforgeclientdev"
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            // Explicitly set correct NeoForge launch target
            type = "neoforgeserverdev"
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            // Explicitly set correct NeoForge data launch target
            type = "neoforgedatadev"
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--mod', 'growthcraft_cellar', '--mod', 'growthcraft_milk', '--all', '--flat', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        "growthcraft_cellar" {
            sourceSet(sourceSets.main)
        }
        // Map Milk module as a logical mod within the same source set
        "growthcraft_milk" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Optional mod dependency with JEI
    // The JEI API can be declared for compile time use if needed, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${minecraft_version}-common-api:+"
    // compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:+"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    localRuntime "mezz.jei:jei-${minecraft_version_short}-neoforge:${jei_version}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        // Local
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Avoid failing on duplicate resources from multiple source dirs (e.g., src/main/resources and src/generated/resources)
tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Automatically run data generation when data generator sources change.
// This task stays up-to-date unless files under the data generator sources are modified.
// When it does run (i.e., inputs changed), it finalizes by invoking the runData task.
// Usage: it is wired into the 'check' lifecycle so regular builds/checks will honor it.
def dataGenSourceFiles = files(
        fileTree(dir: 'src/main/java', include: [
                // Common locations for datagen code
                '**/data/**/*.java',
                '**/datagen/**/*.java',
                'growthcraft/**/data/**/*.java',
                'growthcraft/**/datagen/**/*.java'
        ]),
        // Explicitly include well-known classes
        'src/main/java/growthcraft/core/data/GrowthcraftDataGenerators.java',
        'src/main/java/growthcraft/core/data/worldgen/GrowthcraftWorldgenProvider.java',
        'src/main/java/growthcraft/core/data/tags/GrowthcraftBlockTags.java',
        'src/main/java/growthcraft/core/data/recipe/GrowthcraftRecipeProvider.java'
)

tasks.register('checkDataGeneratorChanges') {
    group = 'verification'
    description = 'Runs runData if data generator sources changed since last run.'

    // Track datagen sources as inputs so Gradle can determine if this task is up-to-date
    inputs.files(dataGenSourceFiles)
            .withPropertyName('dataGenSources')
            .withPathSensitivity(PathSensitivity.RELATIVE)

    // Single marker file to enable up-to-date checks
    def marker = layout.buildDirectory.file('datagen/check.marker')
    outputs.file(marker)

    doLast {
        def markerFile = marker.get().asFile
        markerFile.parentFile.mkdirs()
        markerFile.text = String.valueOf(System.currentTimeMillis())
        logger.lifecycle('Detected changes in data generator sources. Executing runData...')
    }

    // Only triggers when this task actually executes (i.e., when inputs changed)
    finalizedBy 'runData'
}

// Make the standard verification lifecycle depend on the check task above
// so regular builds will run datagen when needed.
plugins.withId('java') {
    tasks.named('check') { dependsOn 'checkDataGeneratorChanges' }
}

def readContentIds = { File file ->
    if (!file.exists()) {
        return [] as Set
    }

    return file.readLines('UTF-8')
            .collect { it.replace('\uFEFF', '').trim() }
            .findAll { !it.isEmpty() }
            .toSorted()
            .toSet()
}

def scanResourceIds = { String kind ->
    def pattern
    if (kind == 'blocks') {
        pattern = ~/^assets[\\\/]([^\\\/]+)[\\\/]blockstates[\\\/](.+)\.json$/
    } else if (kind == 'items') {
        pattern = ~/^assets[\\\/]([^\\\/]+)[\\\/]models[\\\/]item[\\\/](.+)\.json$/
    } else {
        pattern = ~/^data[\\\/]([^\\\/]+)[\\\/]recipes?[\\\/](.+)\.json$/
    }

    def roots = [file('src/main/resources'), file('src/generated/resources')]
    return roots.collectMany { root ->
        if (!root.exists()) {
            return []
        }

        return fileTree(root) {
            include '**/*.json'
        }.collect { resourceFile ->
            def relativePath = root.toPath().relativize(resourceFile.toPath()).toString()
            def matcher = pattern.matcher(relativePath)
            if (!matcher.matches()) {
                return null
            }
            return "${matcher.group(1)}:${matcher.group(2).replace('\\', '/')}"
        }.findAll { it != null }
    }.toSorted().toSet()
}

def readRecipeType = { File recipeFile ->
    def json = new groovy.json.JsonSlurper().parse(recipeFile)
    return json.type?.toString()
}

def scanRecipesWithTypes = {
    def roots = [file('src/main/resources'), file('src/generated/resources')]
    return roots.collectMany { root ->
        if (!root.exists()) {
            return []
        }

        return fileTree(root) {
            include 'data/**/recipes/**/*.json'
            include 'data/**/recipe/**/*.json'
        }.collect { recipeFile ->
            def relativePath = root.toPath().relativize(recipeFile.toPath()).toString()
            def matcher = ~/^data[\\\/]([^\\\/]+)[\\\/]recipes?[\\\/](.+)\.json$/
            def match = matcher.matcher(relativePath)
            if (!match.matches()) {
                return null
            }

            return [
                    id  : "${match.group(1)}:${match.group(2).replace('\\', '/')}",
                    type: readRecipeType(recipeFile),
                    file: recipeFile
            ]
        }.findAll { it != null }
    }.sort { a, b -> a.id <=> b.id }
}

def supportedCustomRecipeTypes = [
        'growthcraft_cellar:culture_jar': 'Culture Jar recipe type and serializer are registered.'
]

