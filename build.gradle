        'growthcraft_apiary:brew_kettle_recipe'              : 'Brew Kettle runtime is not ported yet.',
        'growthcraft_apiary:fermentation_barrel_recipe'      : 'Fermentation Barrel runtime is not ported yet.',
        'growthcraft_apiary:fruit_press_recipe'              : 'Fruit Press runtime is not ported yet.',
        'growthcraft_apples:fermentation_barrel_recipe'      : 'Fermentation Barrel runtime is not ported yet.',
        'growthcraft_apples:fruit_press_recipe'              : 'Fruit Press runtime is not ported yet.',
        'growthcraft_cellar:brew_kettle_recipe'              : 'Brew Kettle runtime is not ported yet.',
        'growthcraft_cellar:culture_jar_recipe'              : 'Legacy Culture Jar recipe type needs migration to the registered 1.21 type.',
        'growthcraft_cellar:culture_jar_starter_recipe'      : 'Legacy Culture Jar starter recipe type needs migration to the registered 1.21 type.',
        'growthcraft_cellar:fermentation_barrel_recipe'      : 'Fermentation Barrel runtime is not ported yet.',
        'growthcraft_cellar:fruit_press_recipe'              : 'Fruit Press runtime is not ported yet.',
        'growthcraft_cellar:roaster_recipe'                  : 'Roaster runtime is not ported yet.',
        'growthcraft_milk:brew_kettle_recipe'                : 'Brew Kettle runtime is not ported yet.',
        'growthcraft_milk:cheese_press_recipe'               : 'Cheese Press runtime is not ported yet.',
        'growthcraft_milk:churn_recipe'                      : 'Churn runtime is not ported yet.',
        'growthcraft_milk:culture_jar_recipe'                : 'Legacy Culture Jar recipe type needs migration to the registered 1.21 type.',
        'growthcraft_milk:culture_jar_starter_recipe'        : 'Legacy Culture Jar starter recipe type needs migration to the registered 1.21 type.',
        'growthcraft_milk:mixing_vat_fluid_recipe'           : 'Mixing Vat runtime is not ported yet.',
        'growthcraft_milk:mixing_vat_item_recipe'            : 'Mixing Vat runtime is not ported yet.',
        'growthcraft_milk:pancheon_recipe'                   : 'Pancheon runtime is not ported yet.',
        'growthcraft_rice:brew_kettle_recipe'                : 'Brew Kettle runtime is not ported yet.',
        'growthcraft_rice:culture_jar_recipe'                : 'Legacy Culture Jar recipe type needs migration to the registered 1.21 type.',
        'growthcraft_rice:culture_jar_starter_recipe'        : 'Legacy Culture Jar starter recipe type needs migration to the registered 1.21 type.',
        'growthcraft_rice:fermentation_barrel_recipe'        : 'Fermentation Barrel runtime is not ported yet.'
